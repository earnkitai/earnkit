[build]
builder = "nixpacks"
installCommand = "npm install -g pnpm@8.15.9"
buildCommand = "cd ../.. && pnpm install && pnpm build:dashboard"
watchPatterns = ["/apps/dashboard/**/*", "turbo.json", "pnpm-lock.yaml", "package.json"]

[deploy]
startCommand = "prisma migrate deploy && node_modules/.bin/next start"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
