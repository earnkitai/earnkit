[build]
builder = "nixpacks"
nixpacksConfigPath = "apps/dashboard/nixpacks.toml"
watchPatterns = ["apps/dashboard/**/*", "turbo.json", "pnpm-lock.yaml", "package.json"]

[deploy]
startCommand = "cd apps/dashboard && pnpm exec prisma migrate deploy && pnpm exec next start"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
