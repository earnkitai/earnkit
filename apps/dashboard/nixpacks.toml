providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@8.15.9 --activate",
  "pnpm install --frozen-lockfile=false"
]

[phases.build]
cmds = ["pnpm build:dashboard"]

[start]
cmd = "cd apps/dashboard && pnpm exec prisma migrate deploy && pnpm exec next start"
