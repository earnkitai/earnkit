[build]
builder = "nixpacks"
buildCommand = """
cd ../..
pnpm install --filter backend...
cd apps/backend
pnpm build
"""

[deploy]
startCommand = """
cd ../..
cd apps/backend
pnpm start
"""
healthcheckPath = "/api/public/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[env]
NODE_ENV = "production"
PORT = "3000" 