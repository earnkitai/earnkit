[build]
builder = "nixpacks"
buildCommand = "pnpm install --filter backend... && pnpm build --filter backend..."
watchPatterns = ["/apps/backend/**/*", "turbo.json", "pnpm-lock.yaml", "package.json"]

[deploy]
startCommand = "pnpm start:backend"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[nixpacks]
nodejs_version = "22"
pnpm_version = "9"