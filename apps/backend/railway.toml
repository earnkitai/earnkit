[build]
builder = "nixpacks"
buildCommand = """
  corepack enable && \
  pnpm install --no-frozen-lockfile && \
  pnpm install --filter backend... && \
  pnpm build --filter backend...
"""

[deploy]
startCommand = "pnpm start:backend"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[nixpacks]
nodejs_version = "20"
pnpm_version = "9"

[phases.setup]
nixPkgs = ["nodejs@20"]
aptPkgs = ["git"]

[phases.install]
cmds = [
    "corepack enable",
    "pnpm install --no-frozen-lockfile"
]