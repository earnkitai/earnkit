providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@8.15.9 --activate",
  "pnpm install --frozen-lockfile=false --prod=false"
]

[phases.build]
cmds = ["pnpm build:earnbackend"]

[start]
cmd = "cd apps/earn-backend && pnpm exec prisma migrate deploy --schema=src/prisma/schema.prisma && node dist/index.js"
