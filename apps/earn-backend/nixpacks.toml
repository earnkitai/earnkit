providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@8.15.9 --activate",
  "cd ../.. && pnpm install --frozen-lockfile=false"
]

[phases.build]
cmds = ["cd ../.. && pnpm build:earnbackend"]

[start]
cmd = "prisma migrate deploy --schema=src/prisma/schema.prisma && node dist/index.js"
