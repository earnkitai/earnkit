name = "earnkit-buyback-cosigner"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# All secrets below are managed via `wrangler secret put <NAME>`, never committed.
# Required secrets:
#   TURNKEY_API_PUBLIC_KEY        — co-signer's public key (registered as a parent-org user in Turnkey)
#   TURNKEY_API_PRIVATE_KEY       — co-signer's private key (this Worker is the only place it lives)
#   TURNKEY_PARENT_ORG_ID         — parent org id (same as Railway's)
#   COSIGNER_SHARED_SECRET        — random 32+ char string; must match BUYBACK_COSIGNER_SHARED_SECRET on Railway
#   BUYBACK_BACKEND_BASE_URL      — earn-backend URL the Worker fetches the buyback-wallet whitelist from
#   BUYBACK_BACKEND_INTERNAL_KEY  — shared secret for that whitelist endpoint
#
# Optional:
#   TURNKEY_API_BASE_URL          — defaults to https://api.turnkey.com

[vars]
# Non-secret defaults can go here. Currently none.
