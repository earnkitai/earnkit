# v2.9 C12: the host Worker for <slug>.earnkit.com. The owner deploys it by hand (`wrangler deploy`
# from this folder). Never deploy it from CI.
name = "earnkit-host"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "earnkit-sites"

[vars]
ZONE = "earnkit.com"
# Every existing DNS name in the zone beyond HOST_RESERVED, comma separated (same list as
# EARNKIT_RESERVED_SUBDOMAINS on Railway). Example: RESERVED = "blog,shop"
RESERVED = ""

# Routes: the owner adds them (Cloudflare dashboard or here), never CI.
# routes = [
#   { pattern = "*.earnkit.com/*", zone_name = "earnkit.com" },
# ]
# Then one exclusion route (Worker: none) per reserved name, e.g. www.earnkit.com/*, docs.earnkit.com/*.
