# EarnKit's one daily job: the freshness probe of every listed program (links, page changes,
# status moves by date), the sweeps, the screen queue's share and the owner's daily digest email. Free tier: one short job a day.
# Needs the repo secret CRON_SECRET (same value as on Railway).
name: EarnKit cron
on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: earnkit-cron
  cancel-in-progress: false
jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST https://earnkit.com/api/cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Not set up yet (before go-live): skip quietly instead of failing (and emailing) every day.
          test -n "$CRON_SECRET" || { echo "::notice::CRON_SECRET is not set; skipping."; exit 0; }
          # A run that answers 5xx, or no answer within 540 s, fails the job (curl's own exit code), and the failed run
          # emails the owner. A 200 lists every failure of the run in `failed` (a program's id, or null for a whole
          # step): any entry fails the job too, so the owner sees it; the next run retries.
          curl -sS --fail-with-body --max-time 540 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -o body.json \
            https://earnkit.com/api/cron || { cat body.json 2>/dev/null; echo; exit 1; }
          cat body.json; echo
          n=$(jq '.failed | length' body.json) || { echo "::error::the answer is not JSON"; exit 1; }
          if [ "$n" -gt 0 ]; then
            jq -r '.failed[] | "::error::\(.step) \(.id // "(whole step)"): \(.error)"' body.json
            exit 1
          fi
