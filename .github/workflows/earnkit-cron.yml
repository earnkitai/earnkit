# EarnKit's one daily job: the freshness probe of every listed program (links, page changes,
# passed deadlines) and the owner's daily digest email. Free tier: one short job a day.
# Needs the repo secret CRON_SECRET (same value as on Railway).
name: EarnKit cron
on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: earnkit-cron
  cancel-in-progress: false
jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST https://earnkit.com/api/cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Not set up yet (before go-live): skip quietly instead of failing (and emailing) every day.
          test -n "$CRON_SECRET" || { echo "::notice::CRON_SECRET is not set; skipping."; exit 0; }
          # A failed step answers 500 (body shown); the failed run emails the owner.
          curl -sS --fail-with-body --max-time 540 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://earnkit.com/api/cron
